            lu: { type: integer }
            inconnu: { type: integer }
            non_couvert: { type: integer }
            hors_standard: { type: integer }
        controls:
          type: array
          items:
            type: object
            required: [id, title, evidence, levels]
            properties:
              id: { type: string }
              title: { type: string }
              evidence: { type: string }
              levels:
                type: array
                items:
                  type: string
                  enum: [verifie, observe, lu, inconnu, non_couvert, hors_standard]
        lastSnapshot:
          type: [object, 'null']
          required: [at, release, sha256]
          properties:
            at: { type: string, format: date-time }
            release: { type: string }
            sha256: { type: string }

    ExportRequest:
      type: object
      required: [format]
