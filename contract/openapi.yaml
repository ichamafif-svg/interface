      type: object
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 3 }
        zoneId: { type: string }

    MessageCreate:
      type: object
      properties:
        text: { type: string }
        actionId: { type: string, description: "Bouton d'action proposé par l'agent" }
      minProperties: 1
      description: Texte libre ou action proposée (au moins l'un des deux).

    Candidate:
      type: object
      required: [id, missionId, additions, deletions, files, diff, reviews, prechecks, precheckSeconds, lessons]
      properties:
        id: { type: string }
        missionId: { type: string }
        additions: { type: integer }
        deletions: { type: integer }
        files: { type: array, items: { type: string } }
        diff: { type: string, description: Diff unifié }
        reviews:
          type: array
          items:
            type: object
            required: [reviewer, verdict, note]
            properties:
              reviewer: { type: string }
              verdict: { type: string, enum: [conform, corrected, refused] }
              note: { type: string }
        prechecks:
          type: array
          items:
            type: object
            required: [tool, status, detail]
            properties:
              tool: { type: string }
              status: { type: string, enum: [passed, failed, refused] }
              detail: { type: string }
        precheckSeconds: { type: integer }
        lessons: { type: array, items: { type: string } }

    AgentMetrics:
      type: object
      required: [windowDays, missions, admitted, rollbacks, firstPassRate, firstPassDelta, reworkAvg, costPerChangeEur, medianLeadTimeSeconds, sandboxRefusalsPerMission]
      properties:
        windowDays: { type: integer }
        missions: { type: integer }
        admitted: { type: integer }
        rollbacks: { type: integer }
        firstPassRate: { type: number }
        firstPassDelta: { type: number }
        reworkAvg: { type: number }
        costPerChangeEur: { type: number }
        medianLeadTimeSeconds: { type: integer }
        sandboxRefusalsPerMission: { type: array, items: { type: number } }

