              operationId: { type: string }
        businessQuestions:
          type: array
          items:
            type: object
            required: [title, detail]
            properties:
              title: { type: string }
              detail: { type: string }
              decisionId: { type: string }
        securityRequests:
          type: array
          items:
            type: object
            required: [title, severity]
