        format: { type: string, enum: [audit_bundle, oscal, vanta, drata, dora, sbom_cyclonedx, siem, exit_bundle] }
        framework: { type: string, enum: [iso27001, dora, nis2] }

    ExportJob:
      type: object
      required: [id, format, status, createdAt]
      properties:
        id: { type: string }
        format: { type: string }
        status: { type: string, enum: [pending, ready, failed] }
        createdAt: { type: string, format: date-time }
        release: { type: string }
        url: { type: string }
        sha256: { type: string }
        includesGaps: { type: boolean, description: Toujours true }

    PlanStep:
      type: object
      required: [key, status, label, detail]
      properties:
        key: { type: string, enum: [spec, impact, policy, code, proof, release] }
        label: { type: string }
        status: { type: string, enum: [done, warning, pending, running] }
        detail: { type: string }
        code: { type: string }
        link: { $ref: '#/components/schemas/ObjectRef' }

    Mission:
      type: object
      required: [id, title, kind, status, zoneId, branch, model, startedAt]
      properties:
        id: { type: string }
        title: { type: string }
