        total: { type: integer }
        requests: { type: integer }
        perDay:
          type: array
          items:
            type: object
            required: [date, primary, others]
            properties:
              date: { type: string, format: date }
              primary: { type: integer }
              others: { type: integer }
        primaryLabel: { type: string }
        top:
          type: array
          items:
            type: object
            required: [route, count, note]
            properties:
              route: { type: string }
              count: { type: integer }
              note: { type: string }
              options:
                type: array
                items:
                  type: object
                  required: [id, label]
                  properties:
                    id: { type: string }
                    label: { type: string }
                    primary: { type: boolean }

    PolicyProposal:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [allow_shadow_refusal, keep_refused, edit_operation] }
        route: { type: string }
        optionId: { type: string }
        operation: { $ref: '#/components/schemas/PolicyOperation' }

    VerificationRun:
      type: object
      required: [zoneId, candidateId, scenarios, scanners, failures]
      properties:
        zoneId: { type: string }
        candidateId: { type: string }
        scenarios:
          type: array
          items:
            type: object
            required: [title, expected, result, outcome]
            properties:
              title: { type: string }
              expected: { type: string }
              result: { type: string }
              outcome: { type: string, enum: [passed, failed, not_covered, out_of_scope] }
              outcomeLabel: { type: string }
        scanners:
          type: array
          items:
            type: object
            required: [tool, reason, activated]
            properties:
              tool: { type: string }
              reason: { type: string }
              activated: { type: boolean }
        catalog:
          type: object
          required: [rules, framework]
          properties:
            rules: { type: integer }
            framework: { type: string }
        failures:
          type: array
          items:
            type: object
            required: [summary, lesson]
            properties:
              summary: { type: string }
              lesson: { type: string }
              missionId: { type: string }

    Transfer:
      type: object
      required: [id, control, location, target, targetDetail, stepsDone, decision]
      properties:
        id: { type: string }
        control: { type: string }
        location: { type: string }
        target: { type: string }
        targetDetail: { type: string }
        stepsDone: { type: integer, minimum: 0, maximum: 5 }
        blockedAt: { type: [integer, 'null'] }
        status: { type: string }
        decision: { type: string, enum: [removal_in_progress, removed, stays_in_product, business_rule, waiting, ready_to_switch] }
        decisionLabel: { type: string }
        stepLabels: { type: array, items: { type: string } }
        proof:
          type: object
          required: [points, statement]
          properties:
            points: { type: array, items: { type: string } }
            statement: { type: string }
        removal:
          type: object
          required: [file, candidateId]
          properties:
            file: { type: string }
            candidateId: { type: string }

    FailMode:
      type: object
      required: [route, mode]
      properties:
        route: { type: string }
        mode: { type: string, enum: [closed, open] }

    FailModeUpdate:
      type: object
      required: [route, mode, signature]
      properties:
        route: { type: string }
        mode: { type: string, enum: [closed, open] }
        signature: { $ref: '#/components/schemas/GestureSignature' }
