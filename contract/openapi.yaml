        object: { $ref: '#/components/schemas/PolicyField' }
        precondition: { $ref: '#/components/schemas/PolicyField' }
        budget: { $ref: '#/components/schemas/PolicyField' }
        channel: { $ref: '#/components/schemas/PolicyField' }

