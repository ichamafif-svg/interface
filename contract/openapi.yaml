              required: [zone, rules, blocks, files, testExpectations, capabilities]
              properties:
                zone: { type: string }
                rules: { type: string }
                blocks: { type: array, items: { type: string } }
                files: { type: array, items: { type: string } }
                testExpectations: { type: string }
                capabilities: { type: string }
            candidateId: { type: string }

