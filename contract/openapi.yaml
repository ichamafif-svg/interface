      type: object
      required: [id, label, tier, evidence, next]
      properties:
        id: { type: string }
        label: { type: string }
        tier: { type: integer, minimum: 1, maximum: 4 }
        evidence: { type: string }
        next: { type: string }
        alwaysHuman: { type: boolean }

    ModelRoute:
      type: object
      required: [task, share, model, location]
      properties:
        task: { type: string }
        share: { type: string }
        model: { type: string }
        location: { type: string, enum: [self_hosted, frontier, external_agent] }

    Zone:
      type: object
      required: [id, name, status, step]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [discovery, frozen, transferring, live, not_started] }
        statusLabel: { type: string }
        step: { type: integer, minimum: 0, maximum: 7, description: Étape du parcours (1 Découvrir … 7 En service) }
        policyVersion: { type: string }

    SharedDependency:
      type: object
      required: [id, name, openIssues, severity]
      properties:
        id: { type: string }
        name: { type: string }
        openIssues: { type: integer }
        severity: { type: string, enum: [ok, warn, bad] }

    InventoryItem:
      type: object
      required: [id, resource, kind, sources, evidence, state]
      properties:
        id: { type: string }
        resource: { type: string }
        kind: { type: string }
        sources:
          type: object
          required: [extractor, ai, real]
          properties:
            extractor: { type: string, enum: [yes, no, warn] }
            ai: { type: string, enum: [yes, no, warn] }
            real: { type: string, enum: [yes, no, warn] }
        evidence:
          oneOf:
            - { $ref: '#/components/schemas/SourceRef' }
            - type: object
              required: [text]
              properties:
                text: { type: string }
                warn: { type: boolean }
        state: { $ref: '#/components/schemas/State' }
        stateLabel: { type: string }
        unsupported:
          type: object
          required: [reasoning, failure, risk]
          properties:
            reasoning: { type: string }
            failure: { type: string }
            risk: { type: string }

