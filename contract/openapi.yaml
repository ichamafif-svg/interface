        status: { type: string, enum: [running, awaiting_decision, admitted, refused, released] }
        zoneId: { type: string }
        branch: { type: string }
        model: { type: string }
        external: { type: boolean }
        startedAt: { type: string, format: date-time }
        costEur: { type: number }
        agentMinutes: { type: number }
        pendingDecisionId: { type: string }

    MissionDetail:
      allOf:
